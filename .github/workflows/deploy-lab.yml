name: Deploy MortalOS Lab

on:
  workflow_run:
    workflows: [Verify]
    branches: [main]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: mortalos-lab-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy reviewed Lab
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      MORTALOS_RELEASE_CANDIDATE_DIR: dist/release-candidate
      MORTALOS_SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out reviewed main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Require exact main revision
        run: |
          test "${{ github.event.workflow_run.event }}" = "push"
          test "${{ github.event.workflow_run.head_branch }}" = "main"
          test "$(git rev-parse HEAD)" = "$MORTALOS_SOURCE_COMMIT"
          git fetch --no-tags origin main
          test "$(git rev-parse refs/remotes/origin/main)" = "$MORTALOS_SOURCE_COMMIT"

      - name: Install locked dependencies
        run: npm ci

      - name: Download candidate from successful Verify run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mortalos-release-candidate-${{ github.event.workflow_run.head_sha }}
          path: dist/release-candidate
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify content-addressed release candidate
        run: npm run verify:release-candidate

      - name: Require deployment credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: test -n "$CLOUDFLARE_ACCOUNT_ID" && test -n "$CLOUDFLARE_API_TOKEN"

      - name: Install Chromium for public verification
        run: npx playwright install --with-deps chromium

      - name: Recheck current main before cloud mutation
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse refs/remotes/origin/main)" = "$MORTALOS_SOURCE_COMMIT"

      - name: Deploy exact relay artifact and Durable Object migration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy --env="" --config relay/wrangler.jsonc

      - name: Deploy exact static artifact
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:lab

      - name: Verify public artifact, relay, and bilingual judge path
        env:
          MORTALOS_EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
          MORTALOS_LAB_URL: https://mortal-os.com
          MORTALOS_DEPLOY_VERIFY_ATTEMPTS: 12
          MORTALOS_DEPLOY_VERIFY_DELAY_MS: 5000
        run: npm run verify:release
