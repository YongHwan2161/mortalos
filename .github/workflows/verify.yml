name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  browser-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium, Firefox, and WebKit
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Probe browser security capabilities
        run: npm run test:browser-capabilities

      - name: Run capability-profiled browser parity
        run: npm run test:browser-parity

  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium for browser verification
        run: npx playwright install --with-deps chromium

      - name: Run repository verification
        run: npm test

      - name: Compare 10,000 Participant Core schedules in Node and Chromium
        run: npm run verify:participant-core

      - name: Compare Chromium with the committed portable corpus
        run: npm run test:chromium

      - name: Run MortalOS Lab browser acceptance gate
        run: npm run verify:lab

      - name: Compare virtual transport schedules in Node and Chromium
        run: npm run verify:transport

      - name: Enforce validator branch coverage
        run: npm run test:coverage

      - name: Verify the S0 baseline receipt
        run: npm run verify:baseline

      - name: Verify the S1 Participant Core receipt
        run: npm run verify:s1

      - name: Verify the S2 durable quorum receipt
        run: npm run verify:s2

      - name: Verify the S3 state recovery receipt
        run: npm run verify:s3

      - name: Verify the S4 confidentiality receipt
        run: npm run verify:s4

      - name: Audit production and development dependencies
        run: npm audit --audit-level=moderate

  release-candidate:
    name: Promote exact release candidate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [browser-parity, protocol]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out verified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build content-addressed release candidate
        env:
          MORTALOS_SOURCE_COMMIT: ${{ github.sha }}
        run: npm run build:release-candidate

      - name: Upload exact release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mortalos-release-candidate-${{ github.sha }}
          path: dist/release-candidate
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
